*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}

.container{max-width:600px;margin:0 auto;padding:80px 20px 40px}
h1{font-size:clamp(24px,4vw,36px);font-weight:900;text-align:center;margin-bottom:4px}
h1 span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:12px 14px;border-radius:10px;background:var(--bg3);
  border:1px solid var(--card-border);color:var(--text);font-family:'Inter',sans-serif;
  font-size:14px;outline:none;transition:border-color 0.3s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent1)}
.form-group textarea{resize:vertical;min-height:80px}

.icon-select{display:flex;gap:8px;flex-wrap:wrap}
.icon-opt{
  padding:8px 16px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--card);cursor:pointer;font-size:14px;transition:all 0.3s;
}
.icon-opt:hover{border-color:var(--accent1)}
.icon-opt.active{background:var(--accent1);border-color:var(--accent1);color:#fff}

.launch-btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--gradient);color:#fff;font-family:'Inter',sans-serif;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:24px;
  box-shadow:0 0 20px rgba(99,102,241,0.2);transition:all 0.3s;
}
.launch-btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(99,102,241,0.3)}

.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;justify-content:center}
.preset-btn{
  padding:6px 14px;border-radius:50px;border:1px solid var(--card-border);
  background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.3s;
}
.preset-btn:hover{border-color:var(--accent1);color:var(--text)}

/* Windows Error Dialog */
.error-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
.error-dialog{
  background:#f0f0f0;border:1px solid #999;border-radius:8px;min-width:340px;max-width:500px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);font-family:'Segoe UI',Tahoma,sans-serif;
  overflow:hidden;animation:popIn 0.2s ease;
}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.error-titlebar{background:linear-gradient(180deg,#4a90d9,#2672c0);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.error-titlebar span{color:#fff;font-size:13px;font-weight:400}
.error-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.error-close:hover{background:rgba(255,255,255,0.2)}
.error-body{padding:20px;display:flex;gap:16px;align-items:flex-start}
.error-icon{font-size:36px;flex-shrink:0}
.error-text{font-size:13px;color:#1a1a1a;line-height:1.5}
.error-buttons{padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #ddd}
.error-btn{
  padding:6px 24px;border-radius:4px;border:1px solid #adadad;
  background:linear-gradient(180deg,#f5f5f5,#e8e8e8);color:#1a1a1a;
  font-family:'Segoe UI',sans-serif;font-size:13px;cursor:pointer;
}
.error-btn:hover{background:linear-gradient(180deg,#e8e8e8,#ddd);border-color:#999}

.ad-slot{text-align:center;padding:20px 0;color:var(--text3);font-size:12px;margin:20px 0}
</style>

<div class="error-overlay" id="overlay" onclick="if(event.target===this)closeError()">
  <div class="error-dialog">
    <div class="error-titlebar">
      <span id="dialogTitle">Critical Error</span>
      <button class="error-close" onclick="closeError()">✕</button>
    </div>
    <div class="error-body">
      <div class="error-icon" id="dialogIcon">❌</div>
      <div class="error-text" id="dialogMsg">Error message here</div>
    </div>
    <div class="error-buttons" id="dialogButtons"></div>
  </div>

<script>
let selectedIcon = '❌';

const presets = {
  virus: {title:'Windows Defender',msg:'🚨 CRITICAL THREAT DETECTED 🚨\n\nTrojan:Win32/Emotet.G!MTB has been found in:\nC:\\Windows\\System32\\drivers\\etc\\hosts\n\nYour personal data (passwords, banking info) is being transmitted to an external server.\n\nClick OK to begin emergency removal.',icon:'❌',buttons:'ok'},
  delete: {title:'Windows Explorer',msg:'System32 has been successfully deleted.\n\nYour computer will become completely non-functional after restart.\n\n437 system files were permanently removed.\n\nWould you like to restart now?',icon:'⚠️',buttons:'yesno'},
  hack: {title:'Security Alert',msg:'⚠️ YOUR COMPUTER HAS BEEN COMPROMISED ⚠️\n\nUnauthorized access detected from IP: 192.168.0.' + Math.floor(Math.random()*255) + '\n\nAll files are being encrypted.\nTime remaining: 00:09:' + (Math.floor(Math.random()*50)+10) + '\n\nDo NOT turn off your computer.',icon:'❌',buttons:'ok'},
  ram: {title:'System Error',msg:'Your computer has run out of memory.\n\nRAM Usage: 99.7% (16,328 MB / 16,384 MB)\n\nClose some applications to free up memory, or click Retry to attempt to continue.\n\nIf this problem persists, consider downloading more RAM.',icon:'⚠️',buttons:'retrycancel'},
  overheat: {title:'Hardware Monitor',msg:'🔥 CRITICAL: CPU TEMPERATURE EXCEEDED SAFE LIMITS 🔥\n\nCurrent Temperature: ' + (Math.floor(Math.random()*10)+95) + '°C\nSafe Maximum: 85°C\n\nYour processor is throttling to prevent permanent damage.\n\nShut down immediately to prevent hardware failure.',icon:'❌',buttons:'abortretry'},
};

function loadPreset(key) {
  const p = presets[key];
  document.getElementById('errTitle').value = p.title;
  document.getElementById('errMsg').value = p.msg;
  document.getElementById('errButtons').value = p.buttons;
  selectedIcon = p.icon;
  document.querySelectorAll('.icon-opt').forEach(o => o.classList.remove('active'));
  document.querySelectorAll('.icon-opt').forEach(o => { if(o.textContent.startsWith(p.icon)) o.classList.add('active'); });
}

function setIcon(el, icon) {
  selectedIcon = icon;
  document.querySelectorAll('.icon-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
}

function showError() {
  document.getElementById('dialogTitle').textContent = document.getElementById('errTitle').value;
  document.getElementById('dialogMsg').textContent = document.getElementById('errMsg').value;
  document.getElementById('dialogIcon').textContent = selectedIcon;

  const btns = document.getElementById('dialogButtons');
  btns.innerHTML = '';
  const type = document.getElementById('errButtons').value;
  const configs = {
    ok: ['OK'],
    okcancel: ['OK','Cancel'],
    yesno: ['Yes','No'],
    retrycancel: ['Retry','Cancel'],
    abortretry: ['Abort','Retry','Ignore'],
  };
  (configs[type]||['OK']).forEach(label => {
    const b = document.createElement('button');
    b.className = 'error-btn';
    b.textContent = label;
    b.onclick = closeError;
    btns.appendChild(b);
  });

  document.getElementById('overlay').style.display = 'flex';
}

function closeError() {
  document.getElementById('overlay').style.display = 'none';
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeError(); });
</script>
