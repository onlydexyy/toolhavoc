.gen-btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--gradient);color:#fff;font-family:'Inter',sans-serif;
  font-size:16px;font-weight:700;cursor:pointer;margin-bottom:24px;
  box-shadow:0 0 20px rgba(99,102,241,0.2);transition:all 0.3s;
}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(99,102,241,0.3)}

.result{display:none;margin-top:24px}
.id-card{
  border-radius:16px;border:1px solid var(--card-border);overflow:hidden;
  background:var(--bg2);box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.id-header{
  background:var(--gradient);padding:16px 20px;text-align:center;
  position:relative;overflow:hidden;
}
.id-header::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,0.03) 10px,rgba(255,255,255,0.03) 20px);
}
.id-header h2{font-size:12px;text-transform:uppercase;letter-spacing:3px;opacity:0.8;position:relative;z-index:1}
.id-header .alias{font-size:28px;font-weight:900;font-family:'Fira Code',monospace;margin-top:6px;position:relative;z-index:1;text-shadow:0 2px 10px rgba(0,0,0,0.3)}

.id-body{padding:20px}
.id-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--card-border)}
.id-row:last-child{border:none}
.id-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600}
.id-value{font-size:14px;font-weight:500;text-align:right;max-width:60%}

.threat-bar{height:6px;border-radius:3px;background:var(--bg3);margin-top:6px;overflow:hidden}
.threat-fill{height:100%;border-radius:3px;transition:width 1s ease}

.backstory{
  margin-top:16px;padding:16px;border-radius:10px;background:var(--bg3);
  border:1px solid var(--card-border);font-size:13px;color:var(--text2);
  line-height:1.6;font-style:italic;
}

.share-row{display:flex;gap:8px;margin-top:16px}
.share-btn{
  flex:1;padding:10px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--card);color:var(--text2);font-size:13px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.3s;text-align:center;
}
.share-btn:hover{border-color:var(--accent1);color:var(--text)}

.ad-slot{text-align:center;padding:20px 0;color:var(--text3);font-size:12px;margin:20px 0}
</style>

<script>
const prefixes = ['x_','0x','Th3_','D4rk_','N3o_','Sh4dow_','Gh0st_','Crypt0_','Ph4nt0m_','Zer0_','C0de_','Gl1tch_','Nul1_','V0id_','Hyp3r_','Sil3nt_','D3ad_'];
const suffixes = ['_X','_0x','_1337','_404','_666','_v2','_exe','_sys','_bin','_root','_sudo','_hack','_pwn','_god','_anon','_dark'];
const specs = ['Zero-Day Exploits','Social Engineering','Cryptographic Attacks','Network Infiltration','Reverse Engineering','Kernel Exploits','Firmware Hacking','AI Manipulation','Quantum Decryption','Deep Web Navigation','Blockchain Exploitation','Memory Corruption','Side-Channel Attacks','Supply Chain Attacks'];
const exploitNames = ['Operation Midnight','Project Chimera','The Gibson Breach','Protocol Omega','Trojan Sunrise','Worm Eclipse','Backdoor Genesis','Payload Alpha','Rootkit Nexus','Buffer Storm','Injection Cascade','Firewall Siege'];
const oses = ['Arch Linux (btw)','Kali Linux 2024.1','ParrotOS','Tails OS','Qubes OS','Custom Gentoo Build','TempleOS (ascended)','Hannah Montana Linux','Windows ME (ironic)','FreeBSD 14'];
const statuses = ['🔴 WANTED — 12 COUNTRIES','🟡 GHOST — NO KNOWN IDENTITY','🟢 ACTIVE — LAST SEEN 2 MIN AGO','🔴 MOST WANTED — INTERPOL','🟡 DARK — OFF THE GRID','🟢 LEGENDARY — HALL OF FAME','🔴 ROGUE — DEFECTED FROM CIA'];
const backstories = [
  'First discovered at age 12 after accidentally gaining root access to their school\'s mainframe while trying to change their lunch menu. Has since become one of the most elusive figures in the cybersecurity underground.',
  'Legend has it they once crashed an entire Fortune 500 company\'s network using nothing but a Raspberry Pi and a Pringles can antenna. They left a single message: "Your firewall is a suggestion."',
  'Trained by a mysterious collective known only as "The Null Pointers," they emerged from the deep web with skills that made nation-state hackers nervous. Their signature move: leaving a ASCII art middle finger in server logs.',
  'After winning every CTF competition on the planet, they grew bored and started creating their own challenges. Rumor has it their personal server hasn\'t been breached in over a decade — and the bounty is $10 million.',
  'Originally a barista who discovered a SQL injection vulnerability in their coffee shop\'s WiFi portal. One thing led to another, and now three-letter agencies have a dedicated task force with their name on it.',
  'Known for their trademark move of replacing compromised websites with a 10-hour loop of the Nyan Cat. Authorities have been unable to determine if this is a political statement or just vibes.',
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function leetify(name) {
  const map = {a:'4',e:'3',i:'1',o:'0',s:'5',t:'7',l:'1'};
  return name.split('').map(c => Math.random() > 0.5 && map[c.toLowerCase()] ? map[c.toLowerCase()] : c).join('');
}

function generate() {
  const name = document.getElementById('realName').value.trim();
  if (!name) { document.getElementById('realName').focus(); return; }

  const base = leetify(name.split(' ')[0]);
  const alias = pick(prefixes) + base + pick(suffixes);
  const threat = 60 + Math.floor(Math.random() * 40);
  const threatColor = threat >= 90 ? '#ef4444' : threat >= 75 ? '#f59e0b' : '#22c55e';

  document.getElementById('alias').textContent = alias;
  document.getElementById('rName').textContent = '[REDACTED]';
  document.getElementById('spec').textContent = pick(specs);
  document.getElementById('exploits').textContent = pick(exploitNames);
  document.getElementById('os').textContent = pick(oses);
  document.getElementById('status').textContent = pick(statuses);
  document.getElementById('backstory').textContent = '📖 ' + pick(backstories);

  const bar = document.getElementById('threatBar');
  bar.style.width = '0%';
  bar.style.background = threatColor;
  setTimeout(() => bar.style.width = threat + '%', 100);

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyResult() {
  const alias = document.getElementById('alias').textContent;
  const spec = document.getElementById('spec').textContent;
  const status = document.getElementById('status').textContent;
  const text = `My hacker name is ${alias}\nSpecialization: ${spec}\nStatus: ${status}\n\nGet yours at toolhavoc.com/tools/hacker-name.html`;
  navigator.clipboard.writeText(text);
}

function shareResult() {
  const alias = document.getElementById('alias').textContent;
  if (navigator.share) {
    navigator.share({ title: 'My Hacker Name', text: `My hacker name is ${alias}! Get yours at ToolHavoc`, url: window.location.href });
  } else { copyResult(); }
}
</script>
