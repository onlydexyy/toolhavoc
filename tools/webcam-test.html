<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Webcam Tester — ToolHavoc</title>
<meta name="description" content="Check if your camera works. See resolution, frame rate, and preview your feed instantly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--card:rgba(255,255,255,0.03);--card-border:rgba(255,255,255,0.06);--text:#e4e4e7;--text2:#a1a1aa;--text3:#52525b;--accent1:#6366f1;--gradient:linear-gradient(135deg,#6366f1,#8b5cf6,#a78bfa)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
nav a{color:var(--text2);text-decoration:none;font-size:14px;font-weight:500}
.nav-brand{font-size:18px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.container{max-width:750px;margin:0 auto;padding:80px 20px 40px}
h1{font-size:clamp(24px,4vw,36px);font-weight:900;text-align:center;margin-bottom:4px}
h1 span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:var(--text2);font-size:15px;margin-bottom:32px}

.video-wrap{
  position:relative;background:var(--bg3);border:1px solid var(--card-border);border-radius:16px;
  overflow:hidden;aspect-ratio:16/9;margin-bottom:24px;display:flex;align-items:center;justify-content:center;
}
video{width:100%;height:100%;object-fit:cover;display:none}
.video-placeholder{text-align:center;padding:20px}
.video-placeholder .icon{font-size:48px;margin-bottom:12px}
.video-placeholder p{color:var(--text2);font-size:15px}
.live-badge{
  position:absolute;top:12px;left:12px;background:#ef4444;color:#fff;
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px;display:none;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.mirror-toggle{
  position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);
  color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
}

.start-btn{
  display:block;width:100%;max-width:400px;margin:0 auto 24px;
  padding:14px;border-radius:12px;border:none;
  background:var(--gradient);color:#fff;font-family:'Inter',sans-serif;
  font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;
  box-shadow:0 0 20px rgba(99,102,241,0.2);
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(99,102,241,0.3)}

.specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:24px}
.spec-card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:14px;transition:all 0.3s}
.spec-card:hover{border-color:rgba(99,102,241,0.3)}
.spec-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.spec-value{font-size:14px;font-weight:600}

.camera-select{
  width:100%;padding:10px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--card-border);
  color:var(--text);font-family:'Inter',sans-serif;font-size:14px;margin-bottom:16px;outline:none;
}
.camera-select:focus{border-color:var(--accent1)}

.error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:16px;color:#fca5a5;font-size:14px;margin-bottom:16px;display:none}

.ad-slot{text-align:center;padding:20px 0;color:var(--text3);font-size:12px;margin:20px 0}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="nav-brand">⚡ ToolHavoc</a>
  <a href="../index.html">← Back</a>
</nav>

<div class="container">
  <h1>Webcam <span>Tester</span></h1>
  <p class="subtitle">Check if your camera works. See resolution and frame rate.</p>

  <div class="video-wrap" id="videoWrap">
    <video id="video" autoplay playsinline></video>
    <div class="video-placeholder" id="placeholder">
      <div class="icon">📷</div>
      <p>Click the button below to start your camera</p>
    </div>
    <div class="live-badge" id="liveBadge">● LIVE</div>
    <button class="mirror-toggle" id="mirrorBtn" onclick="toggleMirror()" style="display:none">🪞 Mirror</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <select class="camera-select" id="cameraSelect" style="display:none" onchange="switchCamera()">
  </select>

  <button class="start-btn" id="startBtn" onclick="startCamera()">📷 Start Camera</button>

  <div class="specs-grid" id="specsGrid" style="display:none"></div>

  <div class="ad-slot" style="text-align:center;padding:20px 0;margin:20px 0;overflow:hidden">
<script async="async" data-cfasync="false" src="https://bauval.org/21/d0f677b4d72b913f07ead837adf17f31"></script>
<div id="container-d0f677b4d72b913f07ead837adf17f31"></div>
</div>

<div class="ad-slot" style="text-align:center;padding:20px 0;margin:20px 0;overflow:hidden">

  };

</div>

<script>
let stream = null;
let mirrored = true;
let fpsInterval;

async function startCamera() {
  const btn = document.getElementById('startBtn');
  const error = document.getElementById('errorMsg');
  error.style.display = 'none';

  try {
    btn.textContent = 'Starting...';
    btn.disabled = true;

    stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:60} },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    video.style.transform = 'scaleX(-1)';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('liveBadge').style.display = 'block';
    document.getElementById('mirrorBtn').style.display = 'block';

    btn.textContent = '⏹ Stop Camera';
    btn.disabled = false;
    btn.onclick = stopCamera;

    // Get cameras list
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');
    if (cameras.length > 1) {
      const select = document.getElementById('cameraSelect');
      select.innerHTML = '';
      cameras.forEach((cam, i) => {
        const opt = document.createElement('option');
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${i+1}`;
        select.appendChild(opt);
      });
      select.style.display = 'block';
    }

    // Show specs after video loads
    video.addEventListener('loadedmetadata', () => {
      showSpecs(video, stream);
    });

    // FPS counter
    let frames = 0;
    let lastTime = performance.now();
    function countFrames() {
      frames++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fpsEl = document.querySelector('[data-spec="fps"]');
        if (fpsEl) fpsEl.textContent = frames + ' fps';
        frames = 0;
        lastTime = now;
      }
      if (stream && stream.active) requestAnimationFrame(countFrames);
    }
    requestAnimationFrame(countFrames);

  } catch(e) {
    btn.textContent = '📷 Start Camera';
    btn.disabled = false;
    error.style.display = 'block';
    if (e.name === 'NotAllowedError') {
      error.textContent = 'Camera access denied. Please allow camera access in your browser settings and try again.';
    } else if (e.name === 'NotFoundError') {
      error.textContent = 'No camera found. Make sure a webcam is connected to your device.';
    } else {
      error.textContent = 'Could not access camera: ' + e.message;
    }
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const video = document.getElementById('video');
  video.style.display = 'none';
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('liveBadge').style.display = 'none';
  document.getElementById('mirrorBtn').style.display = 'none';
  document.getElementById('cameraSelect').style.display = 'none';
  document.getElementById('specsGrid').style.display = 'none';

  const btn = document.getElementById('startBtn');
  btn.textContent = '📷 Start Camera';
  btn.onclick = startCamera;
}

function toggleMirror() {
  mirrored = !mirrored;
  document.getElementById('video').style.transform = mirrored ? 'scaleX(-1)' : 'none';
}

async function switchCamera() {
  const deviceId = document.getElementById('cameraSelect').value;
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId:{exact:deviceId}, width:{ideal:1920}, height:{ideal:1080} }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => showSpecs(video, stream));
  } catch(e) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Could not switch camera: ' + e.message;
  }
}

function showSpecs(video, stream) {
  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings();
  const grid = document.getElementById('specsGrid');
  grid.style.display = 'grid';
  grid.innerHTML = '';

  const specs = [
    {label:'Resolution', value:`${settings.width || video.videoWidth}×${settings.height || video.videoHeight}`},
    {label:'Frame Rate', value:`<span data-spec="fps">measuring...</span>`},
    {label:'Camera', value:track.label || 'Unknown'},
    {label:'Facing', value:settings.facingMode || 'unknown'},
    {label:'Aspect Ratio', value:settings.aspectRatio ? settings.aspectRatio.toFixed(2) : (video.videoWidth/video.videoHeight).toFixed(2)},
    {label:'Status', value:'✅ Working'},
  ];

  specs.forEach(s => {
    const card = document.createElement('div');
    card.className = 'spec-card';
    card.innerHTML = `<div class="spec-label">${s.label}</div><div class="spec-value">${s.value}</div>`;
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
