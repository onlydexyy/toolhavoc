<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>How Old Is My PC? — ToolHavoc</title>
<meta name="description" content="Scan your device's GPU, CPU, and RAM to find out how old it really is — then get roasted.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--card:rgba(255,255,255,0.03);--card-border:rgba(255,255,255,0.06);--text:#e4e4e7;--text2:#a1a1aa;--text3:#52525b;--accent1:#6366f1;--accent2:#8b5cf6;--gradient:linear-gradient(135deg,#6366f1,#8b5cf6,#a78bfa)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
nav a{color:var(--text2);text-decoration:none;font-size:14px;font-weight:500;transition:color 0.2s}
nav a:hover{color:var(--text)}
.nav-brand{font-size:18px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.container{max-width:700px;margin:0 auto;padding:80px 20px 40px}

.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text2);font-size:16px}

.scan-btn{
  display:block;width:100%;max-width:400px;margin:0 auto 40px;
  padding:16px;border-radius:14px;border:none;
  background:var(--gradient);color:#fff;font-family:'Inter',sans-serif;
  font-size:18px;font-weight:700;cursor:pointer;transition:all 0.3s;
  box-shadow:0 0 30px rgba(99,102,241,0.2);
}
.scan-btn:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(99,102,241,0.3)}
.scan-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Progress */
.progress-wrap{display:none;margin-bottom:32px}
.progress-bar{height:4px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;width:0;background:var(--gradient);border-radius:4px;transition:width 0.3s}
.progress-status{font-size:13px;color:var(--text2);text-align:center}

/* Results */
.results{display:none}
.grade-card{
  text-align:center;padding:40px 20px;border-radius:20px;margin-bottom:24px;
  background:var(--card);border:1px solid var(--card-border);position:relative;overflow:hidden;
}
.grade-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient)}
.grade-letter{font-size:80px;font-weight:900;line-height:1;margin-bottom:4px}
.grade-label{font-size:20px;font-weight:700;margin-bottom:8px}
.grade-age{font-size:15px;color:var(--text2)}
.grade-roast{font-size:16px;color:var(--text2);margin-top:16px;line-height:1.6;max-width:500px;margin-left:auto;margin-right:auto}

.specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.spec-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px;
  transition:all 0.3s;
}
.spec-card:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-2px)}
.spec-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.spec-value{font-size:15px;font-weight:600}

.share-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.share-btn{
  padding:10px 20px;border-radius:10px;border:1px solid var(--card-border);
  background:var(--card);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
  font-weight:600;cursor:pointer;transition:all 0.3s;
}
.share-btn:hover{border-color:var(--accent1);background:rgba(99,102,241,0.1)}

/* Ad slot */
.ad-slot{text-align:center;padding:20px 0;color:var(--text3);font-size:12px;margin:20px 0}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="nav-brand">⚡ ToolHavoc</a>
  <a href="../index.html">← Back</a>
</nav>

<div class="container">
  <div class="hero">
    <h1>How Old Is <span>Your PC</span>?</h1>
    <p>We scan your GPU, CPU, and RAM to find out — then roast you for it.</p>
  </div>

  <button class="scan-btn" id="scanBtn" onclick="startScan()">🔍 Scan My Device</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-status" id="progressStatus">Initializing scan...</div>
  </div>

  <div class="ad-slot">[ Ad Space ]</div>

  <div class="results" id="results">
    <div class="grade-card" id="gradeCard">
      <div class="grade-letter" id="gradeLetter">?</div>
      <div class="grade-label" id="gradeLabel"></div>
      <div class="grade-age" id="gradeAge"></div>
      <div class="grade-roast" id="gradeRoast"></div>
    </div>

    <div class="specs-grid" id="specsGrid"></div>

    <div class="share-row">
      <button class="share-btn" onclick="shareResult('twitter')">Share on X</button>
      <button class="share-btn" onclick="shareResult('copy')">📋 Copy Result</button>
      <button class="share-btn" onclick="shareResult('native')">📤 Share</button>
    </div>
  </div>

  <div class="ad-slot">[ Ad Space ]</div>
</div>

<script>
// GPU database: name pattern → release year
const gpuDB = [
  // NVIDIA RTX 50 series
  [/RTX\s*50\d0/i, 2025],
  // NVIDIA RTX 40 series
  [/RTX\s*40\d0/i, 2022], [/RTX\s*4060/i, 2023], [/RTX\s*4070/i, 2023],
  // NVIDIA RTX 30 series
  [/RTX\s*30\d0/i, 2020], [/RTX\s*3060/i, 2021], [/RTX\s*3050/i, 2022],
  // NVIDIA RTX 20 series
  [/RTX\s*20\d0/i, 2018], [/RTX\s*2060/i, 2019],
  // NVIDIA GTX 16 series
  [/GTX\s*16\d0/i, 2019],
  // NVIDIA GTX 10 series
  [/GTX\s*10\d0/i, 2016], [/GTX\s*1050/i, 2016], [/GTX\s*1060/i, 2016], [/GTX\s*1070/i, 2016], [/GTX\s*1080/i, 2016],
  // NVIDIA GTX 9 series
  [/GTX\s*9\d0/i, 2014], [/GTX\s*960/i, 2015], [/GTX\s*950/i, 2015],
  // NVIDIA GTX 7 series
  [/GTX\s*7\d0/i, 2013],
  // NVIDIA GTX 6 series
  [/GTX\s*6\d0/i, 2012],
  // NVIDIA MX series (laptop)
  [/MX\s*5\d0/i, 2023], [/MX\s*4\d0/i, 2021], [/MX\s*3\d0/i, 2019], [/MX\s*2\d0/i, 2017], [/MX\s*1\d0/i, 2017],
  // AMD RX 9000 series
  [/RX\s*9\d{3}/i, 2025],
  // AMD RX 7000 series
  [/RX\s*7\d{3}/i, 2022], [/RX\s*7600/i, 2023], [/RX\s*7700/i, 2023], [/RX\s*7800/i, 2023],
  // AMD RX 6000 series
  [/RX\s*6\d{3}/i, 2020], [/RX\s*6600/i, 2021], [/RX\s*6500/i, 2022],
  // AMD RX 5000 series
  [/RX\s*5\d{3}/i, 2019],
  // AMD RX 500 series
  [/RX\s*5[89]0/i, 2017], [/RX\s*5[67]0/i, 2017],
  // AMD RX 400 series
  [/RX\s*4[89]0/i, 2016], [/RX\s*4[67]0/i, 2016],
  // AMD Vega
  [/Vega/i, 2017],
  // Intel Arc
  [/Arc\s*B\d{3}/i, 2024], [/Arc\s*A\d{3}/i, 2022],
  // Intel integrated
  [/Iris\s*Xe/i, 2020], [/UHD\s*7\d0/i, 2020], [/UHD\s*6\d0/i, 2017], [/UHD\s*Graphics/i, 2017],
  [/Iris\s*Plus/i, 2019], [/Iris\s*Pro/i, 2015], [/HD\s*Graphics\s*[56]\d0/i, 2015], [/HD\s*Graphics\s*[34]\d0/i, 2013],
  [/HD\s*Graphics/i, 2012],
  // Apple Silicon
  [/Apple\s*M4/i, 2024], [/Apple\s*M3/i, 2023], [/Apple\s*M2/i, 2022], [/Apple\s*M1/i, 2020],
  [/Apple\s*GPU/i, 2020],
  // Qualcomm (mobile/ARM laptops)
  [/Adreno\s*7/i, 2022], [/Adreno\s*6/i, 2019], [/Adreno\s*5/i, 2016],
  // Mali (mobile)
  [/Mali-G[78]/i, 2020], [/Mali-G[56]/i, 2017], [/Mali/i, 2015],
];

function detectGPU() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return {name:'Unknown',year:null};
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (!ext) return {name:'Unknown (blocked)',year:null};
    const renderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
    let year = null;
    for (const [pattern, y] of gpuDB) {
      if (pattern.test(renderer)) { year = y; break; }
    }
    return {name: renderer, year};
  } catch(e) { return {name:'Error detecting',year:null}; }
}

function detectSpecs() {
  const gpu = detectGPU();
  return {
    gpu: gpu.name,
    gpuYear: gpu.year,
    cores: navigator.hardwareConcurrency || null,
    ram: navigator.deviceMemory || null,
    screenW: screen.width,
    screenH: screen.height,
    pixelRatio: window.devicePixelRatio || 1,
    colorDepth: screen.colorDepth,
    browser: (() => {
      const ua = navigator.userAgent;
      if (ua.includes('Edg/')) return 'Edge';
      if (ua.includes('Chrome/')) return 'Chrome';
      if (ua.includes('Firefox/')) return 'Firefox';
      if (ua.includes('Safari/') && !ua.includes('Chrome')) return 'Safari';
      return 'Unknown';
    })(),
    os: (() => {
      const p = navigator.platform || '';
      const ua = navigator.userAgent;
      if (ua.includes('Windows')) return 'Windows';
      if (ua.includes('Mac')) return 'macOS';
      if (ua.includes('Linux')) return 'Linux';
      if (ua.includes('Android')) return 'Android';
      if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
      if (ua.includes('CrOS')) return 'ChromeOS';
      return p || 'Unknown';
    })(),
    touchscreen: navigator.maxTouchPoints > 0,
  };
}

function estimateAge(specs) {
  const currentYear = new Date().getFullYear();
  let estimatedYear = null;

  // Primary: GPU year
  if (specs.gpuYear) {
    estimatedYear = specs.gpuYear;
  }

  // Fallback heuristics
  if (!estimatedYear) {
    const cores = specs.cores;
    const ram = specs.ram;
    if (cores && ram) {
      if (cores >= 16 && ram >= 8) estimatedYear = currentYear - 1;
      else if (cores >= 8 && ram >= 8) estimatedYear = currentYear - 3;
      else if (cores >= 8) estimatedYear = currentYear - 4;
      else if (cores >= 4 && ram >= 4) estimatedYear = currentYear - 5;
      else if (cores >= 4) estimatedYear = currentYear - 6;
      else if (cores >= 2) estimatedYear = currentYear - 8;
      else estimatedYear = currentYear - 10;
    } else if (cores) {
      if (cores >= 16) estimatedYear = currentYear - 2;
      else if (cores >= 8) estimatedYear = currentYear - 4;
      else if (cores >= 4) estimatedYear = currentYear - 6;
      else estimatedYear = currentYear - 9;
    } else {
      estimatedYear = currentYear - 5; // total fallback
    }
  }

  const age = currentYear - estimatedYear;
  return { year: estimatedYear, age: Math.max(0, age) };
}

function getGrade(age) {
  if (age <= 1) return {letter:'S', label:'Brand New Beast', color:'#22c55e'};
  if (age <= 2) return {letter:'A', label:'Modern Powerhouse', color:'#4ade80'};
  if (age <= 4) return {letter:'B', label:'Still Got It', color:'#6366f1'};
  if (age <= 6) return {letter:'C', label:'Showing Its Age', color:'#f59e0b'};
  if (age <= 8) return {letter:'D', label:'Veteran Machine', color:'#f97316'};
  return {letter:'F', label:'Digital Fossil', color:'#ef4444'};
}

function getRoast(grade, specs) {
  const roasts = {
    S: [
      "Your PC is so new it still has that fresh silicon smell. Flex on 'em. 💪",
      "This thing is younger than most TikTok trends. You're literally living in the future.",
      "NASA called — they want their hardware back. This machine is absurd.",
    ],
    A: [
      "Solid setup. Your PC can handle anything you throw at it — except maybe your life choices.",
      "This is a respectable machine. Your PC has more power than some people's personalities.",
      "Not bad at all. You could run Cyberpunk on this. Whether you SHOULD is another question.",
    ],
    B: [
      "Your PC is like a reliable Honda Civic — it gets the job done but nobody's impressed.",
      "Still kicking! But it sweats a little when you open too many Chrome tabs. Don't we all.",
      "Mid-tier legend. Your PC peaked a few years ago, just like most of us.",
    ],
    C: [
      "Your PC is old enough to have a driver's permit in some states. Time to think about an upgrade?",
      "This PC has been through things. It's seen Windows updates that broke it and lived to tell the tale.",
      "Your computer runs like it's remembering the good old days instead of living in them.",
    ],
    D: [
      "Your PC belongs in a museum right next to the dinosaur bones. Literally ancient.",
      "I've seen calculators with more processing power. This thing is running on hopes and prayers.",
      "Your PC is so old, it probably remembers when Internet Explorer was the default browser. Unironically.",
    ],
    F: [
      "I'm genuinely impressed this thing turned on. Did you find it at a yard sale? In 2015?",
      "Your PC is a certified relic. Archaeologists are interested. Seriously.",
      "This computer has no business being on the internet in the current year. It deserves retirement.",
    ],
  };
  const arr = roasts[grade] || roasts.C;
  return arr[Math.floor(Math.random() * arr.length)];
}

async function startScan() {
  const btn = document.getElementById('scanBtn');
  const prog = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const status = document.getElementById('progressStatus');
  const results = document.getElementById('results');

  btn.disabled = true;
  prog.style.display = 'block';
  results.style.display = 'none';

  const steps = [
    {pct:15, msg:'Detecting GPU...'},
    {pct:35, msg:'Reading CPU cores...'},
    {pct:55, msg:'Checking memory...'},
    {pct:75, msg:'Analyzing screen...'},
    {pct:90, msg:'Calculating device age...'},
    {pct:100, msg:'Generating roast...'},
  ];

  for (const step of steps) {
    fill.style.width = step.pct + '%';
    status.textContent = step.msg;
    await new Promise(r => setTimeout(r, 400 + Math.random()*300));
  }

  const specs = detectSpecs();
  const {year, age} = estimateAge(specs);
  const grade = getGrade(age);
  const roast = getRoast(grade.letter, specs);

  // Show results
  await new Promise(r => setTimeout(r, 300));
  prog.style.display = 'none';
  results.style.display = 'block';

  document.getElementById('gradeLetter').textContent = grade.letter;
  document.getElementById('gradeLetter').style.color = grade.color;
  document.getElementById('gradeLabel').textContent = grade.label;
  document.getElementById('gradeAge').textContent = `Estimated: ~${year} (${age === 0 ? 'less than 1 year old' : age + ' year' + (age===1?'':'s') + ' old'})`;
  document.getElementById('gradeRoast').textContent = roast;

  // Specs grid
  const grid = document.getElementById('specsGrid');
  grid.innerHTML = '';
  const specItems = [
    {label:'GPU', value:specs.gpu.length > 40 ? specs.gpu.substring(0,40)+'…' : specs.gpu},
    {label:'CPU Cores', value:specs.cores ? specs.cores + ' threads' : 'Hidden by browser'},
    {label:'RAM', value:specs.ram ? specs.ram + ' GB (browser limit)' : 'Hidden by browser'},
    {label:'Screen', value:`${specs.screenW}×${specs.screenH} @${specs.pixelRatio}x`},
    {label:'Browser', value:specs.browser},
    {label:'OS', value:specs.os},
    {label:'Color Depth', value:specs.colorDepth + '-bit'},
    {label:'Touch', value:specs.touchscreen ? 'Yes' : 'No'},
  ];
  specItems.forEach(s => {
    const card = document.createElement('div');
    card.className = 'spec-card';
    card.innerHTML = `<div class="spec-label">${s.label}</div><div class="spec-value">${s.value}</div>`;
    grid.appendChild(card);
  });

  btn.disabled = false;
  btn.textContent = '🔄 Scan Again';

  // Store for sharing
  window._scanResult = {grade, age, year, specs, roast};
}

function shareResult(platform) {
  if (!window._scanResult) return;
  const r = window._scanResult;
  const text = `My PC got a ${r.grade.letter} grade — "${r.grade.label}" (est. ~${r.year})\n\n${r.roast}\n\nScan yours: toolhavoc.com/tools/pc-age.html`;

  if (platform === 'twitter') {
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  } else if (platform === 'copy') {
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      btn.textContent = '✓ Copied!';
      setTimeout(() => btn.textContent = '📋 Copy Result', 2000);
    });
  } else if (platform === 'native' && navigator.share) {
    navigator.share({title:'My PC Age — ToolHavoc', text}).catch(()=>{});
  }
}
</script>
</body>
</html>
